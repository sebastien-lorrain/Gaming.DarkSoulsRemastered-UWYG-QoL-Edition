# Compact console + ANSI colors (%clr is Spring Boot)
logging.pattern.console=%clr(%5p){highlight} %clr(%logger{0}){cyan} : %msg%n%wEx

# CMD often fails Spring's ANSI auto-detect; "always" emits escape codes (fine in Windows Terminal / modern conhost).
# If you redirect logs to a file, use NEVER or a profile without this line to avoid raw escape sequences.
spring.output.ansi.enabled=always

# Skip Spring Boot's first three INFO lines (Starting… / profiles / Started…).
spring.main.log-startup-info=false
